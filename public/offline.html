<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Inspecciones de laboratorio</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 480px;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #475569; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: #1e3a8a;
      color: white;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main role="alert">
    <span class="badge">Sin conexión</span>
    <h1>No hay conexión a internet</h1>
    <p>
      No pudimos cargar esta página porque no hay conexión y todavía no está
      guardada en tu dispositivo. Verifica tu red e intenta de nuevo.
    </p>
  </main>
</body>
</html>
